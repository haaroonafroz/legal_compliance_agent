name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legal_agent_test
          POSTGRES_USER: legal_agent_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legal_agent_test -d legal_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://legal_agent_test:test_only@localhost:5432/legal_agent_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test tools
        run: python -m pip install ".[dev]"

      - name: Check code style
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q