[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-agent"
version = "0.1.0"
description = "Automated regulatory change detection, compliance gap analysis, and policy update drafting"
requires-python = ">=3.11"
dependencies = [
    "llama-index==0.14.24",
    "llama-index-llms-openai==0.7.10",
    "llama-index-llms-openai-like==0.7.2",
    "llama-index-embeddings-openai==0.6.0",
    "llama-index-llms-google-genai==0.10.0",
    "google-genai==2.19.0",
    "qdrant-client==1.19.0",
    "fastembed==0.8.0",
    "scrapy==2.18.0",
    "docling==2.122.0",
    "langfuse==4.14.5",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "openinference-instrumentation-llama-index==4.4.7",
    "langwatch==1.2.0",
    "openai==2.54.0",
    "voyageai==0.5.0",
    "python-dotenv==1.2.3",
    "click==8.4.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "trafilatura==2.2.0",
    "transformers==5.15.1",
    "sentence-transformers==6.0.0",
]

[project.optional-dependencies]
phoenix = [
    "arize-phoenix>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
legal-agent = "legal_agent.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
