services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legal_agent
      POSTGRES_USER: legal_agent
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_agent -d legal_agent"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data_v119:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data_v119:
